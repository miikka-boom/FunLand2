<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fae5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Last Stop">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <title>Last Stop</title>
  <link rel="stylesheet" href="outpost.css">
  <script>
    (function () {
      var d = document.documentElement;
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) d.classList.add('is-touch');
      // Phones have no console: surface the first error on screen.
      function show(msg) {
        var el = document.getElementById('boot-error');
        if (!el || el.dataset.shown) return;
        el.dataset.shown = '1';
        el.textContent = msg;
        el.style.display = 'block';
      }
      window.addEventListener('error', function (e) { show('Error: ' + (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
      setTimeout(function () {
        if (!d.classList.contains('booted')) {
          show(location.protocol === 'file:'
            ? 'Last Stop did not start: browsers block ES modules on file://. Serve the folder instead, e.g. "python3 -m http.server", or use the GitHub Pages URL.'
            : 'Last Stop did not start. Try a hard refresh.');
        }
      }, 4000);
    })();
  </script>
</head>
<body>
  <div id="map" aria-label="Your town"></div>
  <div id="hud"></div>
  <div id="drawer" aria-label="Build"></div>
  <div id="overlay"></div>
  <div id="modals"></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="dev" class="panel" aria-label="Testing tools"></div>
  <div id="rotate"><div><b>Turn your phone sideways</b><span>Last Stop is played in landscape.</span></div></div>
  <div id="boot-error"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
