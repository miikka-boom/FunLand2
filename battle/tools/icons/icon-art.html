<!doctype html>
<html><head><meta charset="utf-8"><title>icon art</title>
<style>body{margin:0;background:#777;font:12px sans-serif} canvas{margin:6px;vertical-align:top}</style>
</head><body>
<script>
// Wobble War app icon: a cute blue clubber bean with big googly eyes and a wooden club,
// against the game's sky / hills / grass / dirt. Drawn in a 512-unit design space.
// opts.round: corner radius as a fraction of the size (transparent corners), 0 = full bleed.
// opts.scale: scale of the whole scene about the character's centre (maskable safe zone).
const TAU = Math.PI * 2;
const BLUE = { body: '#2b6be0', shade: '#1a47a6', light: '#5d97f7', limb: '#2259c4', dark: '#123275' };
const WOOD = '#8f5a2c', WOOD_DARK = '#5a3415', WOOD_LIGHT = '#b9824c';
const EYE_LINE = '#1d1a24';
const PIVOT = [310, 240];

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function cloud(ctx, x, y, s) {
  const puffs = [[-46, 8, 26], [-16, -10, 34], [22, -4, 30], [50, 10, 22], [0, 14, 30]];
  ctx.fillStyle = '#b9c7d8';
  ctx.beginPath();
  for (const [dx, dy, r] of puffs) { ctx.moveTo(x + (dx + r) * s, y + (dy + 6) * s); ctx.arc(x + dx * s, y + (dy + 6) * s, r * s, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = '#fffdf7';
  ctx.beginPath();
  for (const [dx, dy, r] of puffs) { ctx.moveTo(x + (dx + r) * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); }
  ctx.fill();
  ctx.fillStyle = '#dfe4ea';
  ctx.fillRect(x - 70 * s, y + 24 * s, 140 * s, 0);
}

function background(ctx) {
  // Sky
  const sky = ctx.createLinearGradient(0, -60, 0, 400);
  sky.addColorStop(0, '#5ea8de');
  sky.addColorStop(0.55, '#8fcbe8');
  sky.addColorStop(1, '#d5edf3');
  ctx.fillStyle = sky;
  ctx.fillRect(-600, -600, 1712, 1712);
  cloud(ctx, 112, 122, 1.0);
  cloud(ctx, 432, 268, 0.62);
  // Far mountains
  ctx.fillStyle = '#afc1df';
  ctx.beginPath();
  ctx.moveTo(-600, 330);
  ctx.lineTo(-120, 300); ctx.lineTo(-40, 262); ctx.lineTo(0, 300); ctx.lineTo(70, 268); ctx.lineTo(130, 312); ctx.lineTo(210, 250); ctx.lineTo(300, 318);
  ctx.lineTo(380, 262); ctx.lineTo(460, 300); ctx.lineTo(540, 270); ctx.lineTo(620, 310); ctx.lineTo(1100, 300); ctx.lineTo(1100, 400); ctx.lineTo(-600, 400);
  ctx.closePath();
  ctx.fill();
  // Rolling green hills
  ctx.fillStyle = '#a8cc98';
  ctx.beginPath();
  ctx.moveTo(-600, 352);
  ctx.lineTo(-100, 340); ctx.quadraticCurveTo(-40, 320, 0, 352);
  ctx.quadraticCurveTo(90, 310, 190, 345);
  ctx.quadraticCurveTo(300, 380, 400, 330);
  ctx.quadraticCurveTo(460, 305, 512, 330);
  ctx.quadraticCurveTo(580, 350, 640, 330); ctx.lineTo(1100, 340);
  ctx.lineTo(1100, 420); ctx.lineTo(-600, 420);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#95c46a';
  ctx.beginPath();
  ctx.moveTo(-600, 378);
  ctx.lineTo(-60, 372); ctx.quadraticCurveTo(-20, 368, 0, 378);
  ctx.quadraticCurveTo(120, 352, 250, 380);
  ctx.quadraticCurveTo(380, 404, 512, 366);
  ctx.quadraticCurveTo(580, 350, 660, 372); ctx.lineTo(1100, 370);
  ctx.lineTo(1100, 420); ctx.lineTo(-600, 420);
  ctx.closePath();
  ctx.fill();
  // Little trees on the hill
  for (const [x, y, s] of [[-40, 350, 0.9], [60, 352, 1], [96, 346, 0.8], [440, 344, 0.9], [474, 350, 0.75], [560, 346, 0.85]]) {
    ctx.fillStyle = '#7d6a4c';
    ctx.fillRect(x - 2.5 * s, y - 6 * s, 5 * s, 22 * s);
    ctx.fillStyle = '#5f9a4b';
    ctx.beginPath(); ctx.ellipse(x, y - 14 * s, 15 * s, 18 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#93c86a';
    ctx.beginPath(); ctx.ellipse(x - 5 * s, y - 20 * s, 7 * s, 8 * s, 0, 0, TAU); ctx.fill();
  }
  // Grass band
  const g = ctx.createLinearGradient(0, 396, 0, 470);
  g.addColorStop(0, '#bcdd6c');
  g.addColorStop(0.3, '#a7d35a');
  g.addColorStop(1, '#8cc346');
  ctx.fillStyle = g;
  ctx.fillRect(-600, 396, 1712, 80);
  // Grass blades along the far edge
  ctx.fillStyle = '#86bd4c';
  ctx.beginPath();
  for (let x = -600; x < 1100; x += 14) {
    ctx.moveTo(x, 400); ctx.lineTo(x + 5, 388 + ((x * 7) % 9)); ctx.lineTo(x + 10, 400);
  }
  ctx.fill();
  // Dirt cross-section
  ctx.fillStyle = '#b8743a';
  ctx.fillRect(-600, 470, 1712, 700);
  ctx.strokeStyle = '#4a2915';
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  ctx.moveTo(40, 476); ctx.lineTo(70, 498); ctx.lineTo(60, 512);
  ctx.moveTo(170, 474); ctx.lineTo(150, 494); ctx.lineTo(186, 512);
  ctx.moveTo(300, 476); ctx.lineTo(330, 492); ctx.lineTo(318, 512);
  ctx.moveTo(420, 474); ctx.lineTo(446, 500); ctx.lineTo(480, 506);
  ctx.moveTo(-80, 480); ctx.lineTo(-40, 520); ctx.lineTo(-60, 560);
  ctx.moveTo(560, 478); ctx.lineTo(590, 520); ctx.lineTo(570, 560);
  ctx.moveTo(100, 530); ctx.lineTo(140, 560); ctx.moveTo(380, 530); ctx.lineTo(350, 570);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Grass lip hanging over the dirt
  ctx.fillStyle = '#79b23d';
  ctx.beginPath();
  ctx.moveTo(-608, 466);
  for (let x = -608; x <= 1100; x += 32) ctx.quadraticCurveTo(x + 16, 486, x + 32, 468);
  ctx.lineTo(1100, 460); ctx.lineTo(-608, 460);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#9fcb5b';
  ctx.fillRect(-600, 456, 1712, 12);
}

function limb(ctx, pts, col, w) {
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

function club(ctx, hx, hy, tx, ty) {
  const dx = tx - hx, dy = ty - hy, L = Math.hypot(dx, dy);
  const ax = dx / L, ay = dy / L, nx = -ay, ny = ax;
  const N = 12, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const w = 11 + Math.pow(t, 2.0) * 33;
    pts.push([hx + ax * L * t, hy + ay * L * t, w]);
  }
  const path = () => {
    ctx.beginPath();
    ctx.arc(pts[0][0], pts[0][1], pts[0][2], Math.atan2(ny, nx) + Math.PI, Math.atan2(ny, nx), true);
    for (let i = 0; i <= N; i++) ctx.lineTo(pts[i][0] + nx * pts[i][2], pts[i][1] + ny * pts[i][2]);
    const tip = pts[N];
    ctx.arc(tip[0], tip[1], tip[2], Math.atan2(ny, nx), Math.atan2(ny, nx) + Math.PI, true);
    for (let i = N; i >= 0; i--) ctx.lineTo(pts[i][0] - nx * pts[i][2], pts[i][1] - ny * pts[i][2]);
    ctx.closePath();
  };
  path();
  ctx.fillStyle = WOOD;
  ctx.fill();
  // Shade on the right/lower side
  ctx.save();
  path();
  ctx.clip();
  ctx.translate(nx * 12, ny * 12);
  ctx.globalAlpha = 0.0;
  ctx.restore();
  ctx.save();
  path();
  ctx.clip();
  ctx.strokeStyle = '#74461f';
  ctx.lineWidth = 16;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const p = pts[i];
    const x = p[0] + nx * p[2], y = p[1] + ny * p[2];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
  path();
  ctx.strokeStyle = WOOD_DARK;
  ctx.lineWidth = 6;
  ctx.stroke();
  // Highlight streak on the lit side
  ctx.strokeStyle = WOOD_LIGHT;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 3; i <= N; i++) {
    const p = pts[i];
    const o = -p[2] * 0.5;
    if (i === 3) ctx.moveTo(p[0] + nx * o, p[1] + ny * o);
    else ctx.lineTo(p[0] + nx * o, p[1] + ny * o);
  }
  ctx.stroke();
  // Knots
  ctx.fillStyle = WOOD_DARK;
  for (const [t, o, r] of [[0.72, 0.25, 6], [0.9, -0.05, 5], [0.55, 0.15, 4]]) {
    const i = Math.round(t * N);
    const p = pts[i];
    ctx.beginPath();
    ctx.ellipse(p[0] + nx * p[2] * o, p[1] + ny * p[2] * o, r * 1.3, r, Math.atan2(ay, ax), 0, TAU);
    ctx.fill();
  }
  // Grip wrap near the handle end
  ctx.strokeStyle = '#d9c39a';
  ctx.lineWidth = 5;
  for (const d of [0.06, 0.12]) {
    const x = hx + ax * L * d, y = hy + ay * L * d, w = 12;
    ctx.beginPath();
    ctx.moveTo(x + nx * w, y + ny * w);
    ctx.lineTo(x - nx * w + ax * 6, y - ny * w + ay * 6);
    ctx.stroke();
  }
}

function eye(ctx, x, y, r, px, py) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = Math.max(4, r * 0.13);
  ctx.strokeStyle = EYE_LINE;
  ctx.stroke();
  const pr = r * 0.5;
  ctx.beginPath();
  ctx.arc(x + px * (r - pr - r * 0.08), y + py * (r - pr - r * 0.08), pr, 0, TAU);
  ctx.fillStyle = '#111018';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + px * (r - pr - r * 0.08) - pr * 0.35, y + py * (r - pr - r * 0.08) - pr * 0.4, pr * 0.3, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();
}

function character(ctx) {
  const T = BLUE;
  const hip = [226, 312], head = [262, 168], R = 76;
  // shadow
  ctx.fillStyle = 'rgba(28, 52, 12, 0.28)';
  ctx.beginPath();
  ctx.ellipse(240, 424, 104, 15, 0, 0, TAU);
  ctx.fill();
  // legs + feet
  limb(ctx, [[206, 330], [186, 378], [184, 414]], T.shade, 26);
  limb(ctx, [[248, 330], [270, 378], [282, 414]], T.limb, 26);
  ctx.fillStyle = T.dark;
  ctx.beginPath(); ctx.ellipse(196, 418, 26, 13, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(296, 418, 26, 13, 0, 0, TAU); ctx.fill();
  // club behind the near arm, far arm behind the body
  const H = [318, 330], Tp = [446, 84];
  const ax = (Tp[0] - H[0]), ay = (Tp[1] - H[1]), L = Math.hypot(ax, ay);
  const hand1 = [H[0] + ax / L * 34, H[1] + ay / L * 34];
  const hand2 = [H[0] + ax / L * 78, H[1] + ay / L * 78];
  limb(ctx, [[236, 262], [262, 318], hand1], T.shade, 23);
  // body (bean capsule: shade, body shifted toward the light, highlight streak)
  const qx = 244, qy = 238;
  const path = () => { ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.quadraticCurveTo(qx, qy, head[0], head[1]); };
  ctx.lineCap = 'round';
  path(); ctx.strokeStyle = T.dark; ctx.lineWidth = R * 2 + 9; ctx.stroke();
  path(); ctx.strokeStyle = T.shade; ctx.lineWidth = R * 2; ctx.stroke();
  ctx.save();
  ctx.translate(-0.6 * R * 0.17, -0.8 * R * 0.17);
  path(); ctx.strokeStyle = T.body; ctx.lineWidth = R * 1.66; ctx.stroke();
  ctx.translate(-0.6 * R * 0.32, -0.8 * R * 0.18);
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) {
    const t = 0.32 + (0.62 * i) / 8, mt = 1 - t;
    const x = mt * mt * hip[0] + 2 * mt * t * qx + t * t * head[0];
    const y = mt * mt * hip[1] + 2 * mt * t * qy + t * t * head[1];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = T.light; ctx.globalAlpha = 0.7; ctx.lineWidth = R * 0.42; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  // face: big googly eyes looking every which way, happy open mouth
  eye(ctx, 268, 150, 38, 0.55, 0.5);
  eye(ctx, 336, 160, 43, -0.15, 0.75);
  // mouth
  ctx.save();
  ctx.translate(304, 218);
  ctx.rotate(0.12);
  ctx.beginPath();
  ctx.moveTo(-26, 0);
  ctx.quadraticCurveTo(0, -6, 26, 0);
  ctx.quadraticCurveTo(24, 34, 0, 36);
  ctx.quadraticCurveTo(-24, 34, -26, 0);
  ctx.closePath();
  ctx.fillStyle = '#3a0e12';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.beginPath();
  ctx.ellipse(2, 34, 18, 14, 0, 0, TAU);
  ctx.fillStyle = '#ff7f8c';
  ctx.fill();
  ctx.restore();
  ctx.restore();
  // club, then the near arm wrapping the handle
  club(ctx, H[0], H[1], Tp[0], Tp[1]);
  limb(ctx, [[262, 258], [300, 312], hand2], T.limb, 24);
  ctx.fillStyle = T.shade;
  ctx.beginPath(); ctx.arc(hand1[0], hand1[1], 17, 0, TAU); ctx.fill();
  ctx.fillStyle = T.limb;
  ctx.beginPath(); ctx.arc(hand2[0], hand2[1], 18, 0, TAU); ctx.fill();
  ctx.fillStyle = T.light;
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(hand2[0] - 5, hand2[1] - 6, 6, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawIcon(ctx, S, opts = {}) {
  const round = opts.round || 0;
    ctx.save();
  ctx.clearRect(0, 0, S, S);
  if (round > 0) { rr(ctx, 0, 0, S, S, S * round); ctx.clip(); }
  ctx.scale(S / 512, S / 512);
  // Whole scene scaled about the character's visual centre, which lands on the canvas centre.
  const k = opts.scale || 1;
  ctx.translate(256, 256);
  ctx.scale(k, k);
  ctx.translate(-PIVOT[0], -PIVOT[1]);
  if (!opts.noBg) background(ctx);
  character(ctx);
  ctx.restore();
}

window.render = (S, opts) => {
  const c = document.createElement('canvas');
  c.width = c.height = S;
  drawIcon(c.getContext('2d'), S, opts);
  return c.toDataURL('image/png');
};
window.measure = (scale) => {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  drawIcon(g, S, { scale, noBg: true });
  const d = g.getImageData(0, 0, S, S).data;
  let maxR = 0, minX = S, maxX = 0, minY = S, maxY = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (d[(y * S + x) * 4 + 3] < 40) continue;
    maxR = Math.max(maxR, Math.hypot(x + 0.5 - S / 2, y + 0.5 - S / 2));
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  return { maxR: maxR / S, bbox: [minX, minY, maxX, maxY] };
};
window.masked = (S, opts, shape) => {
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  drawIcon(g, S, opts);
  g.globalCompositeOperation = 'destination-in';
  g.beginPath();
  if (shape === 'circle') g.arc(S / 2, S / 2, S * 0.4, 0, TAU);
  else if (shape === 'squircle') rr(g, S * 0.1, S * 0.1, S * 0.8, S * 0.8, S * 0.18);
  else rr(g, 0, 0, S, S, S * 0.2237);
  g.fill();
  document.body.appendChild(c);
};
window.preview = (list) => {
  for (const [S, opts, show] of list) {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    drawIcon(c.getContext('2d'), S, opts);
    if (show) { c.style.width = c.style.height = show + 'px'; }
    document.body.appendChild(c);
  }
};
</script>
</body></html>
