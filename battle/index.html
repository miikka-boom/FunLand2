<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fcbe8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wobble War">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="A wobbly real-time card battler: drop ragdoll beans onto the field, bonk the enemy towers, climb the arenas. Free and fair: no ads, no energy, nothing that wins is for sale.">
  <title>Wobble War</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hub.css">
  <script>
    (function () {
      var d = document.documentElement;
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) d.classList.add('is-touch');
      // Phones have no console: surface the first error on screen (a tap dismisses it).
      // A slow first visit only gets a soft "still loading" note (main.js clears it at boot).
      function el() { return document.getElementById('boot-error'); }
      function show(msg, soft) {
        var b = el();
        if (!b || b.dataset.shown) return;
        if (!soft) b.dataset.shown = '1';
        b.classList.toggle('soft', !!soft);
        b.textContent = msg;
        b.style.display = 'block';
      }
      window.__bootFail = function () { show('The game could not load. Check your connection and try again.'); };
      document.addEventListener('click', function (e) {
        var b = el();
        if (b && e.target === b) b.style.display = 'none';
      });
      window.addEventListener('error', function (e) { show('Error: ' + (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
      setTimeout(function () {
        if (d.classList.contains('booted')) return;
        if (location.protocol === 'file:') show('The game did not start: browsers block ES modules on file://. Serve the folder instead, e.g. "python3 -m http.server", or use the GitHub Pages URL.');
        else show('Still loading the game...', true);
      }, 4000);
      setTimeout(function () {
        if (!d.classList.contains('booted')) show('The game did not start. Try a hard refresh.');
      }, 15000);
    })();
  </script>
</head>
<body class="mode-attract">
  <canvas id="game" aria-label="Battlefield"></canvas>

  <!-- Sandbox: the free-placement toy -->
  <div id="hud" class="hud sandbox-only" aria-live="polite">
    <div class="hud-top">
      <div class="team-bar blue">
        <span class="tag">BLUE</span>
        <div class="bar"><i id="bar-blue"></i></div>
        <b class="count" id="count-blue">0</b>
      </div>
      <div class="round">
        <span class="dash"></span>
        <div class="badge">SANDBOX</div>
        <span class="dash"></span>
      </div>
      <div class="team-bar red">
        <b class="count" id="count-red">0</b>
        <div class="bar"><i id="bar-red"></i></div>
        <span class="tag">RED</span>
      </div>
    </div>
    <div class="hud-sub" id="hud-sub"></div>
  </div>

  <div class="corner-btns sandbox-only">
    <button id="mute-btn" class="icon-btn" type="button" title="Sound (M)" aria-label="Toggle sound">🔊</button>
    <button id="menu-btn" class="icon-btn" type="button" title="Menu (Esc)" aria-label="Menu">≡</button>
  </div>

  <div id="dock" class="dock hidden">
    <div class="cards" id="cards"></div>
    <div class="dock-actions">
      <button id="reframe" class="tool hidden" type="button" title="Show the whole field (F)" aria-label="Show the whole field">🎥<span>Reframe</span></button>
      <button id="erase" class="tool" type="button" title="Remove units (E)" aria-label="Remove units">✖<span>Remove</span></button>
      <button id="clear" class="tool" type="button" title="Clear the field" aria-label="Clear">⟲<span>Clear</span></button>
      <button id="fight" class="fight" type="button" title="Start the battle (Space)">FIGHT!</button>
    </div>
  </div>

  <div id="battle-ctl" class="battle-ctl hidden">
    <button id="slow" class="tool" type="button" title="Slow motion (S)">🐢<span>Slow-mo</span></button>
    <button id="cam" class="tool" type="button" title="Camera follows the fight (F)">🎥<span>Auto cam</span></button>
    <button id="stop" class="tool" type="button" title="Back to placement (R)">⟲<span>Reset</span></button>
  </div>

  <div id="result" class="result hidden">
    <div class="ribbon" id="result-title">BLUE WINS!</div>
    <p id="result-sub"></p>
    <div class="row">
      <button id="home" class="btn" type="button" aria-label="Main menu">⌂</button>
      <button id="retry" class="btn primary" type="button">Again</button>
      <button id="edit" class="btn" type="button">Change armies</button>
    </div>
  </div>

  <!-- Match: the battle screen -->
  <div id="mhud" class="mhud match-only" aria-live="polite">
    <div class="mh-top">
      <div class="mh-side blue">
        <i class="mh-lvl" id="mh-lvl-blue">1</i>
        <b class="mh-name" id="mh-name-blue">You</b>
        <span class="crowns" id="mh-crowns-blue"></span>
      </div>
      <div class="mh-clock" id="mh-clock"><small id="mh-clock-label">TIME</small><b id="mh-time">2:00</b></div>
      <div class="mh-side red">
        <span class="crowns" id="mh-crowns-red"></span>
        <b class="mh-name" id="mh-name-red">Bot</b>
        <i class="mh-lvl" id="mh-lvl-red">1</i>
      </div>
      <button id="mh-pause" class="icon-btn mh-pause" type="button" title="Pause (Esc)" aria-label="Pause">❚❚</button>
    </div>
    <div class="mh-tray" id="mh-tray">
      <div class="mh-next" aria-label="Next card"><small>NEXT</small><canvas id="mh-next"></canvas></div>
      <div class="mh-main">
        <div class="mh-hand" id="mh-hand"></div>
        <div class="mh-mana">
          <span class="mana-drop"><b id="mh-mana-num">5</b></span>
          <div class="mana-bar"><i id="mh-mana-fill"></i><span class="mana-ticks"></span></div>
          <span class="mana-x2" id="mh-x2">×2</span>
        </div>
      </div>
    </div>
  </div>
  <div id="mh-banner" class="mh-banner"></div>
  <div id="aim-tip" class="aim-tip"></div>
  <div id="drag-card" class="drag-card"><canvas></canvas></div>

  <div id="vs" class="vs hidden">
    <div class="vs-side blue"><small>KING LEVEL <b id="vs-lvl-blue">1</b></small><b id="vs-name-blue">You</b></div>
    <div class="vs-mid">VS</div>
    <div class="vs-side red"><small>KING LEVEL <b id="vs-lvl-red">1</b></small><b id="vs-name-red">Bot</b><span class="vs-bot">🤖 computer player</span></div>
    <div class="vs-arena" id="vs-arena">Green Hills</div>
  </div>

  <div id="mresult" class="mresult hidden">
    <div class="mr-card">
      <div class="ribbon" id="mr-title">VICTORY!</div>
      <div class="mr-score">
        <div class="mr-side blue"><b id="mr-name-blue">You</b><span class="crowns big" id="mr-crowns-blue"></span></div>
        <div class="mr-dash">–</div>
        <div class="mr-side red"><b id="mr-name-red">Bot</b><span class="crowns big" id="mr-crowns-red"></span></div>
      </div>
      <p class="mr-reason" id="mr-reason"></p>
      <div class="mr-rewards">
        <span class="pill trophies" id="mr-trophies"><i class="ico">🏆</i><b>+0</b></span>
        <span class="pill gold" id="mr-gold"><i class="coin"></i><b>+0</b></span>
      </div>
      <div class="mr-note hidden" id="mr-note"></div>
      <button id="mr-ok" class="btn primary big mr-ok" type="button">OK</button>
    </div>
  </div>

  <div id="pause" class="modal hidden">
    <div class="card pause-card">
      <h3 id="pause-title">Paused</h3>
      <button id="p-resume" class="btn primary big" type="button">▶ Resume</button>
      <button id="p-surrender" class="btn danger" type="button">🏳 Surrender</button>
      <button id="p-home" class="btn" type="button">⌂ Main menu</button>
      <button id="p-sound" class="btn" type="button">🔊 Sound: on</button>
    </div>
  </div>

  <div id="coach" class="coach hidden" aria-live="polite">
    <div class="say"><span class="say-text"></span><button class="say-skip" type="button" aria-label="Skip the tips">Skip ✕</button></div>
    <i class="coach-hand">👆</i>
  </div>

  <div id="toast" class="toast"></div>

  <div id="rotate"><i class="rot-phone" aria-hidden="true"></i><b class="rot-full">Turn your phone sideways to play</b><span class="rot-pill">Turn your phone sideways for a bigger battlefield</span></div>
  <div id="boot-error"></div>

  <script type="module" src="src/main.js" onerror="window.__bootFail && window.__bootFail()"></script>
</body>
</html>
